; UberSDR Dial — firmware for the Guition JC3636K718 1.8" round knob display
; (ESP32-S3R8, 16 MB flash, 8 MB octal PSRAM, ST77916 QSPI, CST816 touch).

[env:jc3636k718]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
  -DBOARD_HAS_PSRAM
  ; Native USB as USB-Serial/JTAG: gives /dev/ttyACM0 for logs, and lets esptool
  ; reset into download mode without a BOOT button (this board has none exposed).
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DLV_CONF_INCLUDE_SIMPLE
  -I include
  -DCORE_DEBUG_LEVEL=2
  -DWEBSOCKETS_NETWORK_TYPE=NETWORK_ESP32

lib_deps =
  lvgl/lvgl@9.2.2
  bblanchon/ArduinoJson@^7.3.1
  links2004/WebSockets@^2.6.1
  earlephilhower/ESP8266Audio@^1.9.9
  adafruit/Adafruit NeoPixel@^1.12.3
  h2zero/NimBLE-Arduino@^1.4.3

; Experimental: Arduino as an ESP-IDF component with sdkconfig.defaults
; (bigger TCP window / Wi-Fi buffers / TLS in PSRAM). Made Wi-Fi worse in
; testing on 2026-11-03 - see notes in sdkconfig.defaults.
[env:jc3636k718-idf]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
; Arduino as an ESP-IDF component, so lwIP / Wi-Fi / mbedTLS can be tuned via
; sdkconfig.defaults (the prebuilt Arduino SDK can't be). The previous
; Arduino-only config is kept in platformio.arduino-only.ini.
framework = arduino, espidf

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
  -DBOARD_HAS_PSRAM
  ; Native USB as USB-Serial/JTAG: gives /dev/ttyACM0 for logs, and lets esptool
  ; reset into download mode without a BOOT button (this board has none exposed).
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DLV_CONF_INCLUDE_SIMPLE
  -I include
  -DCORE_DEBUG_LEVEL=2
  -DWEBSOCKETS_NETWORK_TYPE=NETWORK_ESP32

lib_deps =
  lvgl/lvgl@9.2.2
  bblanchon/ArduinoJson@^7.3.1
  links2004/WebSockets@^2.6.1
  earlephilhower/ESP8266Audio@^1.9.9
  adafruit/Adafruit NeoPixel@^1.12.3
  h2zero/NimBLE-Arduino@^1.4.3
